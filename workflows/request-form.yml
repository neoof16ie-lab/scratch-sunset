name: リクエスト送信フォーム
description: 実行したい処理のリクエストをここから送信してください。
title: "[Request]: "
labels: ["user-request"] # Actionsが検知するための目印タグ
body:
  - type: markdown
    attributes:
      value: |
        ### リクエストフォームへようこそ！
        以下の項目を入力して「Submit new issue」を押すと、自動で処理が開始されます。
  - type: input
    id: request_data
    attributes:
      label: 処理したいデータ（文字やURLなど）
      placeholder: ここに入力してください
    validations:
      required: true
  - type: dropdown
    id: option_type
    attributes:
      label: 実行オプション
      options:
        - 通常処理
        - 高度な処理
    validations:
      required: true
